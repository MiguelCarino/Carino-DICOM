# Carino DICOM behind nginx: HTTPS for the dashboard and DICOMweb.
#
# Drop this file into /etc/nginx/conf.d/ (it is included inside the http {}
# block), replace pacs.example.org and the two certificate paths, then
# `nginx -t && systemctl reload nginx`.
#
# What this file assumes about Carino DICOM (config.json):
#
#   "web": { "host": "127.0.0.1", "port": 8042, "behind_proxy": true,
#            "auth_token": "<set one: python -m pacs init --token>" }
#
# * host 127.0.0.1: nginx is the only way in. Nothing else on the network can
#   reach the engine, so nothing else can forge the X-Forwarded-* headers that
#   behind_proxy tells it to trust.
# * auth_token: SET IT. The engine only insists on a token when web.host is not
#   loopback, and behind a proxy it IS loopback, so it cannot tell that it is in
#   fact on the network. Without a token, this file publishes an unauthenticated
#   archive to everyone who can reach nginx.
# * behind_proxy: the login rate limit then counts real clients instead of
#   nginx, the session cookie is marked Secure, and DICOMweb RetrieveURLs say
#   https:// and this site's name.
#
# The dashboard uses no WebSocket and no server-sent events — it polls — so
# there is no Upgrade handling here. Add it if a future version needs it.
#
# Tested with nginx 1.27 against a live engine: QIDO-RS and STOW-RS through it,
# HSTS present, TLS 1.1 refused, plain HTTP redirected. See SECURITY.md.

# A second, coarser brake on password guessing, in front of the engine's own
# per-client limit: 10 login attempts a minute per address.
limit_req_zone $binary_remote_addr zone=carino_login:1m rate=10r/m;

upstream carino_dicom {
    server 127.0.0.1:8042;
    keepalive 16;
}

# Plain HTTP only ever answers with a redirect. Nothing is proxied over it.
server {
    listen 80;
    listen [::]:80;
    server_name pacs.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 and newer; on older versions delete this line and write
    # `listen 443 ssl http2;` above instead.
    http2 on;
    server_name pacs.example.org;

    # A certificate from the hospital's CA, or from an ACME client (certbot).
    # The full chain goes in ssl_certificate.
    ssl_certificate     /etc/nginx/tls/carino-dicom.crt;
    ssl_certificate_key /etc/nginx/tls/carino-dicom.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:carino_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # One year, this host only. Add includeSubDomains only if every subdomain
    # of this name already serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # STOW-RS: a whole CT study can arrive in one POST. The engine caps a STOW
    # body at 1 GiB; this sits just above that so the engine, not nginx, is the
    # one that answers "too large".
    client_max_body_size 1100m;
    # Time allowed BETWEEN two reads of the body, not for the whole upload.
    client_body_timeout 300s;

    # Nothing with patient data in it is written to nginx's temp directory:
    # uploads stream straight through to the engine, and responses larger than
    # the memory buffers slow the client down instead of spilling to disk.
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    # Big studies: a large STOW is parsed in memory before the engine answers,
    # and a whole-study WADO-RS can take a while to stream.
    proxy_connect_timeout 10s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location = /api/login {
        limit_req zone=carino_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://carino_dicom;
    }

    location / {
        proxy_pass http://carino_dicom;
    }
}
