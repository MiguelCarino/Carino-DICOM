name: Build desktop app

# Builds the Carino DICOM desktop app (tray agent) for Linux, macOS and Windows.
# Each OS *and each architecture* is built on its own runner — PyInstaller freezes
# the engine into desktop/engine/ as a native executable for the machine it runs
# on, and neither it nor electron-builder can cross-compile, so an arm64 installer
# needs an arm64 runner exactly as much as a Windows installer needs a Windows one.
# electron-builder is then told which arch to package with an explicit CLI flag per
# leg: given no flag it falls back to the runner's own process.arch, which is how
# v1.1.0-rc02 shipped an arm64 dmg and no Intel dmg at all. The target *lists* stay
# in desktop/package.json as plain strings for the same reason — a target object
# carrying its own "arch" array overrides the CLI flag, and a leg asked for two
# arches would package a frozen engine that is only ever one of them.
#
# Runner labels are pinned rather than left as ubuntu/macos/windows-latest: a
# floating label would raise the frozen engine's glibc floor, or move one mac leg
# to a newer macOS major than the other, in the middle of a release series and
# without anybody reviewing it.
#
# The Windows installer name is overridden in desktop/package.json (build.nsis.
# artifactName) because electron-builder's default NSIS pattern is the only one
# with no ${arch} macro in it — both Windows legs would otherwise write
# "Carino-DICOM Setup <version>.exe" and the second upload would silently replace
# the first in the release. dmg, mac zip, AppImage, deb and rpm all already carry
# the arch, so they need nothing.
#
# That override also swaps the default's SPACES for hyphens, which is not
# cosmetic: GitHub rewrites every space in a release asset to a dot as it takes
# the upload, so a spaced name is one string here and a different one in the
# download URL. The website pins these filenames by hand for readers with no JS
# or a rate-limited API (docs/app.js), and it can only do that honestly while the
# name on disk and the name in the URL are the same string.
#
# Artifacts are produced UNSIGNED by default; add the signing
# secrets below and the same workflow produces signed + notarized builds with
# no changes.
#
# Optional secrets (leave unset for unsigned builds):
#   CSC_LINK                  base64 of a code-signing cert (.p12) — macOS & Windows
#   CSC_KEY_PASSWORD          password for that .p12
#   APPLE_ID                  Apple account email (macOS notarization)
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID
#   APPLE_TEAM_ID             Apple Developer Team ID

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      # One leg per (platform, arch). `eb` is the electron-builder arch selector;
      # `expect` is the exact manifest that leg must leave in desktop/dist, so a
      # leg that half-works cannot pass as green. The names come from each
      # target's own default artifactName pattern: x64 is stripped where the
      # pattern allows it, arm64 never is.
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-24.04
            eb: "--linux --x64"
            expect: |
              Carino-DICOM-1.1.0.AppImage
              carino-dicom-desktop-1.1.0.x86_64.rpm
              carino-dicom-desktop_1.1.0_amd64.deb
          - id: linux-arm64
            os: ubuntu-24.04-arm
            eb: "--linux --arm64"
            experimental: true
            expect: |
              Carino-DICOM-1.1.0-arm64.AppImage
              carino-dicom-desktop-1.1.0.aarch64.rpm
              carino-dicom-desktop_1.1.0_arm64.deb
          - id: mac-x64
            os: macos-15-intel
            eb: "--mac --x64"
            expect: |
              Carino-DICOM-1.1.0.dmg
              Carino-DICOM-1.1.0-mac.zip
          - id: mac-arm64
            os: macos-15
            eb: "--mac --arm64"
            expect: |
              Carino-DICOM-1.1.0-arm64.dmg
              Carino-DICOM-1.1.0-arm64-mac.zip
          - id: win-x64
            os: windows-2025
            eb: "--win --x64"
            expect: |
              Carino-DICOM-Setup-1.1.0-x64.exe
          - id: win-arm64
            os: windows-11-arm
            eb: "--win --arm64"
            experimental: true
            expect: |
              Carino-DICOM-Setup-1.1.0-arm64.exe
    runs-on: ${{ matrix.os }}
    # The two arm64 legs are new and have not gone green yet, so they are allowed
    # to fail a manual smoke run without taking the run down with them. A tag build
    # is never forgiving: a v* push that publishes a release with an installer
    # missing must go red. Drop `experimental` from a leg once it has passed once.
    continue-on-error: ${{ matrix.experimental == true && github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # electron-builder needs rpmbuild to emit the .rpm on the Linux runner.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # electron-builder's deb and rpm targets shell out to a prebuilt fpm that it
      # downloads, and that prebuilt exists only as linux-x86_64 and linux-x86 —
      # app-builder's DownloadFpm() is a two-way branch that hands anything not
      # amd64 the 32-bit x86 build, which cannot execute on aarch64. USE_SYSTEM_FPM
      # is the documented escape hatch and takes fpm from PATH instead; Ruby and
      # rpmbuild are already on the image, so a gem install is all that is missing.
      - name: Provide a native fpm for the arm64 Linux leg
        if: matrix.id == 'linux-arm64'
        run: sudo gem install --no-document fpm

      # --only-binary=:all: is a coverage tripwire, not a speedup. Every dependency
      # (direct and transitive) publishes a wheel for all six targets today, so the
      # flag costs nothing now; the day one of them stops doing so for one arch, it
      # turns a silent source build — or a subtly wrong engine — into a pip error
      # on the exact leg that lost coverage.
      - name: Freeze the DICOM engine (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt pyinstaller
          pyinstaller packaging/pacs-engine.spec --distpath desktop/engine --workpath build/pyi --noconfirm

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # Only export the signing vars when the secret actually has a value.
      # An EMPTY CSC_LINK makes electron-builder try to sign with an empty cert
      # path (→ "desktop not a file") on macOS/Windows. Absent (not exported) =
      # unsigned build, which succeeds. Secrets are read via env, not inlined in
      # the script, so they can't leak/inject.
      - name: Configure code signing (only when secrets are set)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            val="${!v}"
            if [ -n "$val" ]; then
              { echo "$v<<__EOF__"; printf '%s\n' "$val"; echo "__EOF__"; } >> "$GITHUB_ENV"
              echo "signing: $v is set"
            fi
          done

      # matrix.eb carries the platform and arch flags. Without an arch flag
      # electron-builder builds only archFromString(process.arch), which is fine by
      # accident on a matching runner and wrong the moment a leg is meant to differ
      # from its host. USE_SYSTEM_FPM renders as the literal "false" off the arm64
      # Linux leg — it must never render as the empty string, which app-builder's
      # IsEnvTrue() reads as true.
      - name: Build installers (electron-builder)
        working-directory: desktop
        env:
          USE_SYSTEM_FPM: ${{ matrix.id == 'linux-arm64' }}
        run: npx --no-install electron-builder ${{ matrix.eb }} --publish never

      # if-no-files-found: error on the upload only catches a leg that produced
      # nothing at all; a Linux leg that built the AppImage and lost the deb and
      # rpm would still upload, still be green, and still ship a release with a
      # hole in it. Checking the leg's declared manifest catches partial output
      # too, and doubles as the reviewable statement of what a release contains.
      - name: Verify this leg produced everything it promised
        shell: bash
        run: |
          missing=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "desktop/dist/$f" ]; then
              echo "ok      $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done <<'__EXPECT__'
          ${{ matrix.expect }}
          __EXPECT__
          {
            echo "### ${{ matrix.id }} (${{ matrix.os }})"
            echo ""
            echo '```'
            ls -l desktop/dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $missing

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 hard-errors on a duplicate artifact name within a
          # run, and two legs now share every os value, so the leg id is the key.
          name: carino-dicom-${{ matrix.id }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.rpm
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe

  # Assembling a release by hand is what has kept the download page pinned to an
  # old version: six artifact bundles to fetch, unzip and re-attach, every time,
  # and any one of them forgotten ships a release that is missing a platform. So
  # the tag does it. This job runs ONLY for a v* tag — `workflow_dispatch` builds
  # stop at the artifacts, which is what makes dispatch the safe way to try a
  # matrix change without publishing anything.
  #
  # `needs: build` is the gate: every leg must be green, and on a tag the two
  # experimental arm64 legs are NOT forgiven (continue-on-error is scoped to
  # workflow_dispatch), so a release cannot go out missing an architecture.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default token is read-only in repositories that were configured that
    # way, and a release job silently 403ing is worse than one that never ran.
    permissions:
      contents: write
    steps:
      # merge-multiple flattens all six bundles into one directory. Their
      # filenames are unique by construction — every artifact carries its
      # architecture — which is the property that makes flattening safe.
      - name: Collect every leg's installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          # A hyphen in the tag means a pre-release: v1.1.0-rc03 is one, v1.1.0
          # is not. That is the convention this repo already follows by hand, and
          # it matters beyond a label — the website asks for /releases/latest,
          # which skips pre-releases, so this flag alone decides whether a tag
          # moves the download buttons.
          case "$GITHUB_REF_NAME" in
            *-*) flag="--prerelease" ;;
            *)   flag="--latest" ;;
          esac
          # Idempotent, because a re-run must not fail on a release that the
          # first run already created.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release exists — replacing its assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Installers for every supported platform and architecture. See CHANGELOG.md for what changed." \
              $flag
          fi
