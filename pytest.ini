[pytest]
# The suites are deliberately dual-mode: every file keeps its own __main__
# runner, so "python3 tests/test_qr.py" still works on a machine with no pytest
# at all — which is the normal state of a clinical box you have SSH'd into.
# Nothing here changes that path. This file only pins down what a bare "pytest"
# collects, so CI and a developer's laptop agree on the same set of tests.

# test_print.py predates the tests/ directory and still lives at the repo root.
# Listing both keeps a bare "pytest" honest: without the root file named here,
# the print SCP — the one service in this project with no equivalent anywhere
# else — is silently not run, and the count at the bottom of the log still looks
# like a full suite. No number is written here on purpose; a total in a config
# comment is wrong within the month and then teaches the reader to distrust the
# rest of the file. `pytest --collect-only -q` says what it is today.
testpaths = test_print.py tests

# -ra prints the reason for every non-pass at the end, so a skip can never hide
# in a wall of dots; --tb=short keeps a failing assert to the frame that matters.
# --durations exists because the socket suites are the slow ones and it should
# be obvious when one of them starts hanging rather than failing.
addopts = -ra --tb=short --strict-markers --durations=10

# Deliberately no pytest-xdist. test_print.py and tests/test_qr.py bind real
# sockets on fixed base ports (11211+ and 11401+) and increment a module global
# to hand out the next one. Two workers would import those modules independently,
# hand out the SAME ports, and fail with association errors that read like DICOM
# bugs instead of like a scheduling bug. The suite runs serially in a couple of
# minutes, most of it association timeouts that are wall-clock either way, so
# parallelising it would buy noise rather than time.

# .venv is broken on the dev box and site-packages is full of other people's
# tests, so collection must never wander in there.
norecursedirs = .git .venv venv build dist node_modules __pycache__ desktop packaging docker

# An association that hangs is the worst failure mode in this project: it burns
# the entire CI budget and tells you nothing about which image stopped arriving.
# pytest-timeout converts a hang into a normal failure with a real traceback.
# Unknown-config warning is harmless when the plugin is absent (standalone runs).
timeout = 300
