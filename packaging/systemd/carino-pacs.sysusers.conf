# Carino DICOM service account — install as /usr/lib/sysusers.d/carino-pacs.conf
#
# Applied with:  systemd-sysusers /usr/lib/sysusers.d/carino-pacs.conf
#
# Fields: type name id gecos home shell
#   u             = user (and a group of the same name)
#   -             = let the system pick the uid/gid from the system range
#   /var/lib/carino-pacs
#                 = home is the data directory. The service passes --config
#                   explicitly so this is never used for path resolution, but a
#                   system user whose home does not exist makes Python's
#                   expanduser("~") return junk, so it points somewhere real.
#   /usr/sbin/nologin
#                 = no interactive login. Nothing about this service needs a
#                   shell, and the account owns patient data.
u carino-pacs - "Carino DICOM gateway" /var/lib/carino-pacs /usr/sbin/nologin
