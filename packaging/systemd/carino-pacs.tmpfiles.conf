# Carino DICOM data directory — install as /usr/lib/tmpfiles.d/carino-pacs.conf
#
# Applied with:  systemd-tmpfiles --create /usr/lib/tmpfiles.d/carino-pacs.conf
#
# The unit's StateDirectory= already creates and chowns /var/lib/carino-pacs on
# every start. This file exists so the directory is there BEFORE the first
# start, which is when the installer has to write config.json into it, and so
# the layout is declared somewhere a distro packager can read it.
#
# Modes match the unit: 0750 on the top directory (StateDirectoryMode=), and the
# service's UMask=0077 keeps everything it creates itself at 0600/0700. Group
# read on the top directory only, so an operator added to the carino-pacs group
# can list the tree without being handed every study.
#
# Fields: type path mode user group age argument
d /var/lib/carino-pacs           0750 carino-pacs carino-pacs -
d /var/lib/carino-pacs/received  0700 carino-pacs carino-pacs -
d /var/lib/carino-pacs/outgoing  0700 carino-pacs carino-pacs -
d /var/lib/carino-pacs/sent      0700 carino-pacs carino-pacs -
d /var/lib/carino-pacs/pending   0700 carino-pacs carino-pacs -
d /var/lib/carino-pacs/logs      0700 carino-pacs carino-pacs -

# received/ outgoing/ sent/ logs/ are what `pacs init` creates. pending/ and
# ris/ are made lazily by the code when first needed, and index.db appears on
# demand; pending/ is pre-created here because it holds studies that failed to
# forward — the one directory you do not want a permissions surprise in.
#
# No age argument on any line, deliberately. tmpfiles' cleanup is not allowed
# anywhere near this tree: every file under it is patient data or its audit
# trail, and deciding what may be deleted is a retention policy, not a
# housekeeping default.
